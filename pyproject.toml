[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-sound-effect-generator"
version = "0.9.4"
description = "Plugin-host AI sound effect generator for Windows desktop — text-to-SFX, sample morphing, and diffusion-based one-shots."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sfx-lab", email = "dev@sfxlab.tools" }]
keywords = ["audio", "sound-effects", "diffusion", "text-to-audio", "sfx", "plugin-host"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",
    "pydantic>=2.7,<3",
    "PySide6>=6.7",
    "torch>=2.3; platform_system=='Windows'",
    "torchaudio>=2.3; platform_system=='Windows'",
    "transformers>=4.41",
    "diffusers>=0.29",
    "loguru>=0.7.2",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10", "pytest-cov>=5.0"]
cuda = ["torch>=2.3+cu121"]

[project.scripts]
sfxgen = "sfxgen.bootstrap.cli:main"
sfxgen-gui = "sfxgen.bootstrap.desktop:main"

[project.entry-points."sfxgen.plugins"]
noise-morph = "sfxgen.plugins.noise_morph.plugin:NoiseMorphPlugin"
granular-cloud = "sfxgen.plugins.granular_cloud.plugin:GranularCloudPlugin"
diffusion-oneshot = "sfxgen.plugins.diffusion_oneshot.plugin:DiffusionOneShotPlugin"
sample-pack = "sfxgen.plugins.sample_pack.plugin:SamplePackPlugin"

[tool.hatch.build.targets.wheel]
packages = ["sfxgen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sfxgen --cov-report=term-missing"